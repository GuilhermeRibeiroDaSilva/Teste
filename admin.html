<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Games - Adm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/Logo AS.png">
</head>

<body class="produtos">
    <div id="link">
        <a href="admin.html">Inicio</a>
        <a href="index.html">Produtos</a>
    </div>


    <h1>Administrar Produtos</h1>
    <form id="formCadastro">
        <div>
            <label for="nome">Nome do jogo</label>
            <input type="text" id="nome" required>
        </div>
        <div>
            <label for="preco">Preco do jogo</label>
            <input type="text" id="preco" required>
        </div>
        <div>
            <label for="categoria">Plataforma</label>
            <input type="text" id="categoria" required>
        </div>
        <div class="botoes">
            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </div>
    </form>
 <table class="tabela-produtos">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Preço</th>
                <th>Plataforma</th>
                <th>Ações</th>
            </tr>
        </thead>
<tbody id="itens"></tbody>


    <script src="assets/js/scriptAdmin.js"></script>
</body>

</html>
